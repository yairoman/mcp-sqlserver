<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1288 596" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flujo-consulta-title flujo-consulta-desc" id="flujo-consulta-root">
      <title id="flujo-consulta-title">Flujo de una consulta en mcp-sqlserver</title>
      <desc id="flujo-consulta-desc">Una consulta viaja del usuario al LLM, que llama a la tool execute_query por JSON-RPC sobre STDIO; el servidor sanea los argumentos, sql-sanitizer la valida y comprueba el modo solo lectura, rechazando la consulta con un error si falla, y si pasa el pool mssql se conecta en la primera consulta, SQL Server la ejecuta y formatQueryResult devuelve la tabla al LLM y al usuario.</desc>
      <defs>
      <style>#flujo-consulta-root { --paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--soft:#5a6580;--accent:#bf4520;--accent-tint:rgba(191,69,32,.08);--rule:rgba(45,49,66,.12);--label-rule:rgba(45,49,66,.20);--lane:rgba(45,49,66,.018);--node:#fff;--node-stroke:rgba(45,49,66,.25);--chip:rgba(45,49,66,.12);--dot:rgba(45,49,66,.10);--reject:#9c6b50;--sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif',serif;--mono:'Geist Mono',ui-monospace,monospace }
      #flujo-consulta-root { font-family: var(--sans); color: var(--ink); }
      #flujo-consulta-root .scroll { overflow-x:auto }
      #flujo-consulta-root .note { margin-top:1rem;font:italic 1rem/1.4 var(--serif);color:var(--muted) }
      #flujo-consulta-root .note code { font:.8rem var(--mono);font-style:normal }
      #flujo-consulta-root text { font-family:var(--sans) }
      #flujo-consulta-root .mono { font-family:var(--mono) }
      #flujo-consulta-root .lane { fill:var(--lane) }
      #flujo-consulta-root .rule { stroke:var(--rule) }
      #flujo-consulta-root .label-rule { stroke:var(--label-rule) }
      #flujo-consulta-root .actor { fill:var(--muted);font:500 8px var(--mono);letter-spacing:.08em }
      #flujo-consulta-root .step-label { fill:var(--muted);font:500 6px var(--mono);letter-spacing:.12em }
      #flujo-consulta-root .step-chip { fill:var(--chip) }
      #flujo-consulta-root .step-num { fill:var(--ink);font:600 7px var(--mono) }
      #flujo-consulta-root .connector { fill:none;stroke:var(--muted);stroke-width:1 }
      #flujo-consulta-root .connector.focal { stroke:var(--accent);stroke-width:1.2 }
      #flujo-consulta-root .connector.detour { stroke-dasharray:4 3 }
      #flujo-consulta-root .arrow-label-mask { fill:var(--paper) }
      #flujo-consulta-root .arrow-label { fill:var(--muted);font:500 6.5px var(--mono);letter-spacing:.08em }
      #flujo-consulta-root .node-mask { fill:var(--paper) }
      #flujo-consulta-root .node { fill:var(--node);stroke:var(--node-stroke) }
      #flujo-consulta-root .node.focal { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #flujo-consulta-root .node.reject { fill:rgba(156,107,80,.06);stroke:rgba(156,107,80,.35) }
      #flujo-consulta-root .role { fill:rgba(45,49,66,.10) }
      #flujo-consulta-root .role.focal { fill:rgba(191,69,32,.25) }
      #flujo-consulta-root .role.reject { fill:rgba(156,107,80,.18) }
      #flujo-consulta-root .role-text { fill:var(--ink);font:600 6px var(--mono) }
      #flujo-consulta-root .role-text.focal { fill:var(--accent) }
      #flujo-consulta-root .role-text.reject, #flujo-consulta-root .node-title.reject { fill:var(--reject) }
      #flujo-consulta-root .node-title { fill:var(--ink);font:600 9px var(--sans) }
      #flujo-consulta-root .node-sub { fill:var(--muted);font:6.5px var(--mono) }
      #flujo-consulta-root .node-tool { fill:var(--soft);font:6.5px var(--mono) }
      #flujo-consulta-root .legend-key { fill:var(--muted);font:500 7px var(--mono);letter-spacing:.12em }
      #flujo-consulta-root .legend-text { fill:var(--muted);font:8px var(--sans) }</style>
        <pattern id="flujo-consulta-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="0.8" fill="var(--dot)"/></pattern>
        <marker id="flujo-consulta-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--muted)"/></marker>
        <marker id="flujo-consulta-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--accent)"/></marker>
        <marker id="flujo-consulta-arrow-sm" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0,6 2.5,0 5" fill="var(--muted)"/></marker>
      </defs>
      <rect width="1288" height="596" fill="var(--paper)"/><rect width="1288" height="596" fill="url(#flujo-consulta-dots)" opacity=".55"/>
      <rect class="lane" x="140" y="36" width="1148" height="80"/><rect class="lane" x="140" y="196" width="1148" height="80"/><rect class="lane" x="140" y="356" width="1148" height="80"/>
      <g class="rule" stroke-width=".8"><line x1="0" y1="36" x2="1288" y2="36"/><line x1="0" y1="116" x2="1288" y2="116"/><line x1="0" y1="196" x2="1288" y2="196"/><line x1="0" y1="276" x2="1288" y2="276"/><line x1="0" y1="356" x2="1288" y2="356"/><line x1="0" y1="436" x2="1288" y2="436"/><line x1="0" y1="516" x2="1288" y2="516"/></g>
      <line class="label-rule" x1="140" y1="36" x2="140" y2="516"/>
      <g class="actor" text-anchor="middle">
        <text x="70" y="80">USUARIO</text>
        <text x="70" y="152">LLM /</text><text x="70" y="160">CLIENTE MCP</text>
        <text x="70" y="232">SERVIDOR MCP</text><text x="70" y="240">(STDIO)</text>
        <text x="70" y="320">VALIDACIÓN</text>
        <text x="70" y="392">POOL</text><text x="70" y="400">MSSQL</text>
        <text x="70" y="480">SQL SERVER</text>
      </g>
      <g text-anchor="middle">
        <rect class="step-chip" x="190" y="8" width="16" height="16" rx="8"/><text class="step-num" x="198" y="19">1</text><text class="step-label" x="198" y="32">PETICIÓN</text>
        <rect class="step-chip" x="302" y="8" width="16" height="16" rx="8"/><text class="step-num" x="310" y="19">2</text><text class="step-label" x="310" y="32">LLAMADA</text>
        <rect class="step-chip" x="414" y="8" width="16" height="16" rx="8"/><text class="step-num" x="422" y="19">3</text><text class="step-label" x="422" y="32">ARGUMENTO</text>
        <rect x="526" y="8" width="16" height="16" rx="8" fill="#bf4520" fill-opacity=".20"/><text x="534" y="19" fill="var(--accent)" font-size="7" font-weight="600" class="mono">4</text><text x="534" y="32" fill="var(--accent)" font-size="6" font-weight="500" letter-spacing=".12em" class="mono">SANITIZER</text>
        <rect class="step-chip" x="638" y="8" width="16" height="16" rx="8"/><text class="step-num" x="646" y="19">5</text><text class="step-label" x="646" y="32">LECTURA</text>
        <rect class="step-chip" x="750" y="8" width="16" height="16" rx="8"/><text class="step-num" x="758" y="19">6</text><text class="step-label" x="758" y="32">CONEXIÓN</text>
        <rect class="step-chip" x="862" y="8" width="16" height="16" rx="8"/><text class="step-num" x="870" y="19">7</text><text class="step-label" x="870" y="32">EJECUCIÓN</text>
        <rect class="step-chip" x="974" y="8" width="16" height="16" rx="8"/><text class="step-num" x="982" y="19">8</text><text class="step-label" x="982" y="32">FORMATO</text>
        <rect class="step-chip" x="1086" y="8" width="16" height="16" rx="8"/><text class="step-num" x="1094" y="19">9</text><text class="step-label" x="1094" y="32">RESULTADO</text>
        <rect class="step-chip" x="1196" y="8" width="20" height="16" rx="8"/><text class="step-num" x="1206" y="19">10</text><text class="step-label" x="1206" y="32">RESPUESTA</text>
      </g>
      <!-- Connectors: right exit, orthogonal bends, top/bottom entry; dashed = rejection detour. -->
      <path class="connector" d="M248 76 H302 Q310 76 310 84 V124" marker-end="url(#flujo-consulta-arrow)"/>
      <path class="connector" d="M360 156 H414 Q422 156 422 164 V204" marker-end="url(#flujo-consulta-arrow)"/>
      <path class="connector focal" d="M472 236 H526 Q534 236 534 244 V284" marker-end="url(#flujo-consulta-arrow-accent)"/>
      <line class="connector focal" x1="584" y1="328" x2="596" y2="328" marker-end="url(#flujo-consulta-arrow-accent)"/>
      <path class="connector detour" d="M584 304 Q590 304 590 298 V242 Q590 236 596 236 H708" marker-end="url(#flujo-consulta-arrow-sm)"/>
      <path class="connector detour" d="M696 304 H750 Q758 304 758 296 V268" marker-end="url(#flujo-consulta-arrow-sm)"/>
      <path class="connector" d="M696 328 H750 Q758 328 758 336 V364" marker-end="url(#flujo-consulta-arrow)"/>
      <path class="connector detour" d="M808 236 Q814 236 814 230 V162 Q814 156 820 156 H1044" marker-end="url(#flujo-consulta-arrow-sm)"/>
      <path class="connector" d="M808 396 H862 Q870 396 870 404 V444" marker-end="url(#flujo-consulta-arrow)"/>
      <path class="connector" d="M920 476 H974 Q982 476 982 468 V268" marker-end="url(#flujo-consulta-arrow)"/>
      <path class="connector" d="M1032 236 H1086 Q1094 236 1094 228 V188" marker-end="url(#flujo-consulta-arrow)"/>
      <path class="connector" d="M1144 156 H1198 Q1206 156 1206 148 V108" marker-end="url(#flujo-consulta-arrow)"/>
      <g text-anchor="middle">
        <rect class="arrow-label-mask" x="620" y="219" width="64" height="10"/><text class="arrow-label" x="652" y="227">PATRÓN VETADO</text>
        <rect class="arrow-label-mask" x="766" y="277" width="48" height="10"/><text class="arrow-label" x="790" y="285">ESCRITURA</text>
      </g>
      <!-- Nodes -->
      <g text-anchor="middle">
        <g><rect class="node-mask" x="148" y="44" width="100" height="64" rx="6"/><rect class="node" x="148" y="44" width="100" height="64" rx="6"/><rect class="role" x="152" y="48" width="20" height="10" rx="2"/><text class="role-text" x="162" y="56">USR</text><text class="node-title" x="198" y="70">Pregunta</text><text class="node-sub" x="198" y="84">lenguaje natural</text><text class="node-tool" x="198" y="96">TiendaDemo</text></g>
        <g><rect class="node-mask" x="260" y="124" width="100" height="64" rx="6"/><rect class="node" x="260" y="124" width="100" height="64" rx="6"/><rect class="role" x="264" y="128" width="20" height="10" rx="2"/><text class="role-text" x="274" y="136">LLM</text><text class="node-title" x="310" y="150">Llamada a tool</text><text class="node-sub" x="310" y="164">tools/call · JSON-RPC</text><text class="node-tool" x="310" y="176">execute_query</text></g>
        <g><rect class="node-mask" x="372" y="204" width="100" height="64" rx="6"/><rect class="node" x="372" y="204" width="100" height="64" rx="6"/><rect class="role" x="376" y="208" width="20" height="10" rx="2"/><text class="role-text" x="386" y="216">MCP</text><text class="node-title" x="422" y="230">Argumentos</text><text class="node-sub" x="422" y="244">sanitizeIdentifier</text><text class="node-tool" x="422" y="256">withErrorHandling</text></g>
        <g><rect class="node-mask" x="484" y="284" width="100" height="64" rx="6"/><rect class="node focal" x="484" y="284" width="100" height="64" rx="6"/><rect class="role focal" x="488" y="288" width="20" height="10" rx="2"/><text class="role-text focal" x="498" y="296">VAL</text><text class="node-title" x="534" y="310">Sanitizer</text><text class="node-sub" x="534" y="324">validateQuerySafety</text><text class="node-tool" x="534" y="336">sql-sanitizer.ts</text></g>
        <g><rect class="node-mask" x="596" y="284" width="100" height="64" rx="6"/><rect class="node" x="596" y="284" width="100" height="64" rx="6"/><rect class="role" x="600" y="288" width="20" height="10" rx="2"/><text class="role-text" x="610" y="296">VAL</text><text class="node-title" x="646" y="310">Solo lectura</text><text class="node-sub" x="646" y="324">isReadOnlyQuery</text><text class="node-tool" x="646" y="336">MSSQL_READ_ONLY</text></g>
        <g><rect class="node-mask" x="708" y="204" width="100" height="64" rx="6"/><rect class="node reject" x="708" y="204" width="100" height="64" rx="6"/><rect class="role reject" x="712" y="208" width="20" height="10" rx="2"/><text class="role-text reject" x="722" y="216">MCP</text><text class="node-title reject" x="758" y="230">Rechazo</text><text class="node-sub" x="758" y="244">Query rejected</text><text class="node-tool" x="758" y="256">no toca la base</text></g>
        <g><rect class="node-mask" x="708" y="364" width="100" height="64" rx="6"/><rect class="node" x="708" y="364" width="100" height="64" rx="6"/><rect class="role" x="712" y="368" width="20" height="10" rx="2"/><text class="role-text" x="722" y="376">POL</text><text class="node-title" x="758" y="390">Pool diferido</text><text class="node-sub" x="758" y="404">getPool() · connect()</text><text class="node-tool" x="758" y="416">solo en la 1.ª consulta</text></g>
        <g><rect class="node-mask" x="820" y="444" width="100" height="64" rx="6"/><rect class="node" x="820" y="444" width="100" height="64" rx="6"/><rect class="role" x="824" y="448" width="20" height="10" rx="2"/><text class="role-text" x="834" y="456">SQL</text><text class="node-title" x="870" y="470">Ejecución</text><text class="node-sub" x="870" y="484">request.query()</text><text class="node-tool" x="870" y="496">executeQueryOnDatabase</text></g>
        <g><rect class="node-mask" x="932" y="204" width="100" height="64" rx="6"/><rect class="node" x="932" y="204" width="100" height="64" rx="6"/><rect class="role" x="936" y="208" width="20" height="10" rx="2"/><text class="role-text" x="946" y="216">MCP</text><text class="node-title" x="982" y="230">Formato</text><text class="node-sub" x="982" y="244">formatQueryResult</text><text class="node-tool" x="982" y="256">result-formatter.ts</text></g>
