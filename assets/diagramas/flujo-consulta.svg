        <text class="legend-key" x="144" y="556">COLOR</text><rect x="220" y="549" width="16" height="8" rx="2" fill="#9c6b50" stroke="#9c6b50" fill-opacity=".06" stroke-opacity=".35"/><text class="legend-text" x="244" y="556">Rechazo · el servidor devuelve el error al LLM sin consultar SQL Server</text>
        <text class="legend-key" x="144" y="577">FLUJO</text>
