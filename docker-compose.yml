version: "3.8"

services:
  # SQL Server for development/testing
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "MorroMcp#2024"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "MorroMcp#2024" -C -Q "SELECT 1" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # MCP Server
  mcp-server:
    build: .
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_HOST: sqlserver
      MSSQL_PORT: "1433"
      MSSQL_USER: sa
      MSSQL_PASSWORD: "MorroMcp#2024"
      MSSQL_DATABASE: master
      MSSQL_TRUST_SERVER_CERTIFICATE: "true"
      MSSQL_READ_ONLY: "true"
      MSSQL_MAX_ROWS: "1000"
    stdin_open: true

volumes:
  sqldata:
