# Development / testing only. Credentials come from a local, untracked .env
# (copy .env.example and set MSSQL_SA_PASSWORD). Nothing secret lives in this file.
services:
  # SQL Server for development/testing
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: "Developer"
    ports:
      # Bound to localhost only: not reachable from the network.
      - "127.0.0.1:1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      # $$ defers expansion to the container, so the password is not baked into the command.
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # MCP Server
  mcp-server:
    build: .
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_HOST: sqlserver
      MSSQL_PORT: "1433"
      # The throwaway dev container only has sa. Against any real instance use a
      # least-privilege login (see README, "Login de mínimo privilegio").
      MSSQL_USER: sa
      MSSQL_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      MSSQL_DATABASE: master
      # The dev container uses a self-signed certificate.
      MSSQL_TRUST_SERVER_CERTIFICATE: "true"
      MSSQL_READ_ONLY: "true"
      MSSQL_MAX_ROWS: "1000"
    stdin_open: true

volumes:
  sqldata:
